services:
  - type: web
    name: maintenance-wizard-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./maintenance_wizard.db
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
